name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        django: ['5.2', '6.0', '6.1']
    name: Python ${{ matrix.python }}, Django ${{ matrix.django }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Installs the package for its dependencies, pinning Django to the matrix version.
      - run: pip install . "django~=${{ matrix.django }}.0"
      - run: django-admin test website_widgets --settings=test_settings --pythonpath=.

  # The npm package: npm ci runs its prepare script, which builds dist/ with tsc.
  frontend:
    runs-on: ubuntu-latest
    name: npm package
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm pack --dry-run

  # Every folder under examples/ holding a manage.py is a project, so a new example needs no edit here.
  find-examples:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.find.outputs.examples }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          examples=$(find examples -name manage.py -printf '%h\n' | sort | jq -R . | jq -sc .)
          echo "examples=$examples" >> "$GITHUB_OUTPUT"

  example:
    needs: find-examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.find-examples.outputs.examples) }}
    name: Example ${{ matrix.example }}
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install poetry
      - run: poetry install --no-interaction
      - run: poetry run python manage.py migrate --noinput
      - run: poetry run python manage.py test
      # An example with a build (a package.json in its website app) has TypeScript and SCSS that
      # its Python tests never compile, so a type error or a broken stylesheet would pass them.
      # The no-build examples skip these steps.
      - uses: actions/setup-node@v4
        if: hashFiles(format('{0}/*/package.json', matrix.example)) != ''
        with:
          node-version: '24'
      # The example depends on frontend/ by path, and npm builds a path dependency with that
      # folder's own tools, so they're installed first.
      - name: Install the npm package's build tools
        if: hashFiles(format('{0}/*/package.json', matrix.example)) != ''
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type-check and build the frontend
        if: hashFiles(format('{0}/*/package.json', matrix.example)) != ''
        run: |
          for package_json in */package.json; do
            (
              cd "$(dirname "$package_json")"
              npm ci --no-audit --no-fund
              npx tsc --noEmit -p .
              npm run build:production
            )
          done
