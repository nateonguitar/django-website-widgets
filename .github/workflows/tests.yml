name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        django: ['5.2', '6.0', '6.1']
    name: Python ${{ matrix.python }}, Django ${{ matrix.django }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "django~=${{ matrix.django }}.0"
      - run: django-admin test website_widgets --settings=test_settings --pythonpath=.
