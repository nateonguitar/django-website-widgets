[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "django-website-widgets"
version = "0.7.0"
description = "Server-rendered pages built from composable widgets, for Django"
readme = "README.md"
authors = [
    {name = "Nate Brooks"},
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "psutil>=5.9",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = ["django", "widgets", "components", "pages"]

[project.urls]
Homepage = "https://github.com/nateonguitar/django-website-widgets"
Repository = "https://github.com/nateonguitar/django-website-widgets"
Issues = "https://github.com/nateonguitar/django-website-widgets/issues"

[tool.poetry]
# The distribution name doesn't match the import name, so the package is named explicitly.
packages = [{include = "website_widgets"}]
# The tests run from a checkout and the examples are their own projects; neither ships.
exclude = ["website_widgets/tests/**", "examples/**"]

[tool.djlint]
# Ignore:
#   H021: Inline styles should be avoided
#   H006: Img tag should have height and width attributes
ignore = "H021,H006"
profile = "django"
indent = 2
indent_attributes = true          # attributes on separate lines
max_line_length = 80              # or whatever; must be non-zero
max_attribute_length = 1          # force line break when there's any attr
format_attribute_order = "none"
max_blank_lines = 1
line_break_after_multiline_tag = true
format_css = true
format_js = true
