[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "django-website-widgets"
version = "0.1.0"
description = "A reusable Django app for managing website widgets and pages"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "website_widgets"}]

[tool.poetry.dependencies]
python = "^3.10"
django = ">=4.2"

[project]
name = "django-website-widgets"
version = "0.1.0"
description = "A reusable Django app for managing website widgets and pages"
readme = "README.md"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = ["django", "widgets", "cms", "pages"]
dependencies = [
    "django>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
]

[project.urls]
Homepage = "https://github.com/yourusername/django-website-widgets"
Repository = "https://github.com/yourusername/django-website-widgets"

[tool.setuptools.packages.find]
where = ["."]
include = ["website_widgets*"]

[tool.setuptools.package-data]
website_widgets = ["templates/**/*", "static/**/*"]
