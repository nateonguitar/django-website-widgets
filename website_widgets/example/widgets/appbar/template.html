{% comment %}
Put styles in a stylesheet and import them using static, this is just for simplicity.
{% endcomment %}
<style>
    #appbar {
        background: rgba(255, 255, 255, 0.1);
        padding: 16px 24px;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    #appbar h1 {
        font-size: 20px;
        font-weight: 500;
    }

    .appbar-nav a {
        color: rgba(255, 255, 255, 0.9);
        text-decoration: none;
        margin-left: 24px;
        font-size: 14px;
    }

    .appbar-nav a.selected {
        font-weight: bold;
    }

    .appbar-nav a:hover {
        text-decoration: underline;
    }

    .appbar-back-link {
        color: rgba(255, 255, 255, 0.9);
        text-decoration: none;
        margin-right: 8px;
    }

    .appbar-back-link:hover {
        text-decoration: underline;
    }
</style>
<header id="appbar">
    <h1>
        {% if page.show_appbar_back_button %}
            <a href="{% url 'example_index' %}" class="appbar-back-link">◄</a>
        {% endif %}
    </h1>
    <nav class="appbar-nav">
        <a href="{% url 'example_simple_page' %}"
           class="{% if page.nav_item.value == 'SIMPLE_PAGE' %}selected{% endif %}">Simple</a>
        <a href="{% url 'example_widget_composition_page' %}"
           class="{% if page.nav_item.value == 'WIDGET_COMPOSITION' %}selected{% endif %}">Composition</a>
        <a href="{% url 'example_unwrapped_page' %}"
           class="{% if page.nav_item.value == 'UNWRAPPED_PAGE' %}selected{% endif %}">Unwrapped</a>
        <a href="{% url 'example_caching_page' %}"
           class="{% if page.nav_item.value == 'CACHING_PAGE' %}selected{% endif %}">Caching</a>
    </nav>
</header>
