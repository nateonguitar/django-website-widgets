<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <title>{{ page.title|default:"Example App" }} - Base 1</title>
        <meta name="description"
              content="Base template 1 with purple gradient theme">
        <meta name="keywords"
              content="base template, purple theme, website widgets">
        <!-- internal styles used for simplicity, use a static external stylesheet -->
        <style>
          * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
          }

          body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
          }

          #main-content {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
          }
        </style>
    </head>
    <body>
        {{ children.appbar }}

        <main id="main-content">
            {{ main_content_html }}
        </main>

        {{ children.footer }}
    </body>
</html>
