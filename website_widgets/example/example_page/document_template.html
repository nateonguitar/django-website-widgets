<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ page.title }} | {{ page.site_name }}</title>
        <meta name="description" content="{{ page.description }}">
        {{ children.stylesheet }}
    </head>
    <body>
        <main class="example-main">
            {% if page.back_url %}
                <p class="example-back"><a href="{{ page.back_url }}">&larr; {{ page.back_label }}</a></p>
            {% endif %}
            {{ page_content_html }}
        </main>
    </body>
</html>
