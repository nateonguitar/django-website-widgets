<style>
    #example-appbar {
        border-bottom: 1px solid var(--example-border);
        background: var(--example-surface);
    }

    #example-appbar-inner {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        align-items: center;
        max-width: 860px;
        margin: 0 auto;
        padding: 12px 16px;
    }

    #example-appbar-home {
        color: var(--example-text);
        font-weight: 700;
        text-decoration: none;
    }

    #example-appbar-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
    }

    #example-appbar-viewer {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-left: auto;
    }
</style>
<header id="example-appbar">
    <div id="example-appbar-inner">
        <a id="example-appbar-home" href="{% url 'website_widgets_example_projects' %}">Projects app</a>
        <nav id="example-appbar-nav">
            <a href="{% url 'website_widgets_example_projects' %}">Your projects</a>
            <a href="{% url 'website_widgets_example_project_create' %}">New project</a>
            <a href="{% url 'website_widgets_example_admin' %}">Admin</a>
            <a href="{% url 'website_widgets_example_index' %}">All examples</a>
        </nav>
        <div id="example-appbar-viewer">
            {% if page.viewer %}
                <span>{{ page.viewer.name }}{% if page.viewer.is_admin %} (admin){% endif %}</span>
                <button id="example-appbar-logout" class="example-button example-button-secondary" type="button">Log out</button>
                <span id="example-appbar-error" class="example-field-error" role="alert"></span>
            {% else %}
                <a class="example-button" href="{{ page.login_url }}">Log in</a>
            {% endif %}
        </div>
    </div>
</header>
{% if page.viewer %}
    <script>
        const exampleLogoutButton = document.getElementById('example-appbar-logout');
        exampleLogoutButton.addEventListener('click', async () => {
            exampleLogoutButton.disabled = true;
            const result = await exampleApi.send('POST', '{% url "website_widgets_example_api_logout" %}');
            if (result.ok) {
                window.location.reload();
                return;
            }
            exampleLogoutButton.disabled = false;
            document.getElementById('example-appbar-error').textContent = result.error;
        });
    </script>
{% endif %}
