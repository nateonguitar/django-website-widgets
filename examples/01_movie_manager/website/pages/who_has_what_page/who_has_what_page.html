<main id="who-has-what-page"
      class="who-has-what-page">
  <h1>Who has what</h1>
  {% if children.rows %}
    <table class="who-has-what-page__table">
      <thead>
        <tr>
          <th scope="col">Movie</th>
          <th scope="col">Who has it</th>
          <th scope="col">For</th>
        </tr>
      </thead>
      <tbody>
        {% for row in children.rows %}
          {{ row }}
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>Everything is on the shelf.</p>
  {% endif %}
</main>
