{# No title, so the question names the dialog: DialogController.openFrame() reads data-dialog-label. #}
<p class="confirm-dialog__message"
   data-dialog-label></p>
<div class="confirm-dialog__actions">
  <button type="button"
          class="confirm-dialog__no text-button"></button>
  <button type="button"
          class="confirm-dialog__yes"></button>
</div>
