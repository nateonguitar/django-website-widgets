{% load static %}
<li class="rental-row"
    data-key="{{ data.key }}"
    data-rental-id="{{ data.rental.id }}">
  <span class="rental-row__title">{{ data.rental.copy.movie.title }}</span>
  <a class="rental-row__label"
     href="{% url 'website:CopyPage' label=data.rental.copy.label %}"><code>{{ data.rental.copy.label }}</code></a>
  <span class="rental-row__taken">taken {{ children.taken }}</span>
  <button type="button"
          class="rental-row__return">Return it</button>
  <span class="rental-row__message"
        role="alert"></span>
</li>

<script type="module">
  import { App, RentalRowController } from '{% static "main.js" %}';
  await App.initController(new RentalRowController(), '.rental-row[data-key="{{ data.key }}"]');
</script>
