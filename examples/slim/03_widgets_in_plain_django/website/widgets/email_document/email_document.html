<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ data.subject }}</title>
    </head>
    {# Inline styles only: most mail apps drop <style> blocks and linked stylesheets. #}
    <body style="margin: 0; padding: 24px 12px; background: #f4f4f4; font-family: Arial, sans-serif; color: #222222;">
        <div style="max-width: 560px; margin: 0 auto; padding: 24px; background: #ffffff; border-radius: 6px;">
            <p style="margin: 0 0 20px; font-weight: bold;">
                <a href="{{ page.events_url }}" style="color: #222222; text-decoration: none;">Widgets in plain Django</a>
            </p>
            {{ children.content }}
            <p style="margin: 24px 0 0; padding-top: 16px; border-top: 1px solid #dddddd; font-size: 12px; color: #666666;">
                Sent by the widgets in plain Django example. <a href="{{ page.events_url }}" style="color: #1a5fb4;">See every upcoming event</a>.
            </p>
        </div>
    </body>
</html>
