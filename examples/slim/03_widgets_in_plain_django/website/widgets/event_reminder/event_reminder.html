<h1 style="margin: 0 0 8px; font-size: 20px;">{{ data.event.name }}</h1>
<p style="margin: 0 0 12px; color: #666666;">{{ data.event.starts_at|date:"D j M Y, H:i" }} at {{ data.event.location }}</p>
{% if data.event.description %}
    <p style="margin: 0 0 12px;">{{ data.event.description }}</p>
{% endif %}
<p style="margin: 0;">
    <a href="{{ page.events_url }}#example-event-{{ data.event.id }}" style="color: #1a5fb4;">See it on the events page</a>
</p>
